
services:
  servidor:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      - servidor
    restart: unless-stopped
